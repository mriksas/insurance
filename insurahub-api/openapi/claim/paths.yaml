claims:
  get:
    tags:
      - Claims
    summary: View claims
    description: >
      Returns insurance claims with key information. Administrators can view all claims.
      Consumers can view only their own claims.
    operationId: getClaims
    x-spring-paginated: true
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Page size. Values above 100 are capped to 100 by the application.
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 20
      - name: claimNumber
        in: query
        required: false
        description: Optional case-sensitive pattern to filter claims by claim number.
        schema:
          type: string
          minLength: 1
          maxLength: 13
          pattern: '^[A-Za-z0-9]+$'
      - name: consumer
        in: query
        required: false
        description: >
          Optional case-sensitive pattern to filter claims by consumer full name
          in "firstname lastname" format.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z ]+$'
      - name: sort
        in: query
        required: false
        description: >
          Optional sorting in Spring Pageable format: property or property,direction.
          Direction can be asc or desc. Allowed properties: createdAt, serviceDate,
          claimNumber, amount, status.
        schema:
          type: string
          default: serviceDate,desc
    responses:
      '200':
        description: Claims retrieved successfully.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GetClaimsResponse'
      '400':
        $ref: '../common/responses.yaml#/BadRequest'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'

  post:
    tags:
      - Claims
    summary: File a claim for an enrollment
    description: >
      Creates a new pending claim for a specific enrollment and attaches one receipt file.
      Only administrators can perform this operation. The receipt file must be a PDF,
      JPG, or PNG and must be smaller than 10 MiB. Send this as multipart/form-data
      with a JSON part named postClaimRequest and a file part named receiptFile.
    operationId: postClaim
    requestBody:
      required: true
      description: >
        Multipart form containing claim details as JSON and one receipt file.
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - postClaimRequest
              - receiptFile
            properties:
              postClaimRequest:
                $ref: './schemas.yaml#/PostClaimRequest'
              receiptFile:
                type: string
                format: binary
                description: Receipt file upload. Accepted formats are PDF, JPG, and PNG.
          encoding:
            postClaimRequest:
              contentType: application/json
            receiptFile:
              contentType: application/pdf, image/jpeg, image/png
    responses:
      '201':
        $ref: '../common/responses.yaml#/Created'
      '400':
        $ref: '../common/responses.yaml#/BadRequest'
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '415':
        $ref: '../common/responses.yaml#/UnsupportedMediaType'
      '422':
        $ref: '../common/responses.yaml#/UnprocessableEntity'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'

claimApprove:
  post:
    tags:
      - Claims
    summary: Approve a pending claim
    description: >
      Approves a claim that is currently pending. Only administrators can perform this operation.
      Claims that are not in a pending state cannot be approved.
    operationId: approveClaim
    parameters:
      - name: claimId
        in: path
        required: true
        description: Claim ID.
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Claim approved successfully.
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '409':
        $ref: '../common/responses.yaml#/Conflict'
      '422':
        $ref: '../common/responses.yaml#/UnprocessableEntity'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'

receiptByClaimId:
  get:
    tags:
      - Claims
    summary: Download a receipt
    description: Returns the receipt file by claim ID.
    operationId: getReceipt
    parameters:
      - name: claimId
        in: path
        required: true
        description: Claim ID.
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Receipt file returned successfully.
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../common/responses.yaml#/Unauthorized'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '500':
        $ref: '../common/responses.yaml#/InternalServerError'

claimById:
  put:
    tags:
      - Claims
    summary: Update a pending claim
    description: Updates the date of service, plan, and amount of a pending claim. The plan must be one the consumer is enrolled in.
    operationId: putClaim
    parameters:
      - name: claimId
        in: path
        required: true
        description: Claim ID.
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateClaimRequest'
    responses:
      '204':
        description: Updated claim
      '400':
        $ref: '../common/responses.yaml#/BadRequest'
      '403':
        $ref: '../common/responses.yaml#/Forbidden'
      '404':
        $ref: '../common/responses.yaml#/NotFound'
      '422':
        $ref: '../common/responses.yaml#/UnprocessableEntity'
      '409':
        $ref: '../common/responses.yaml#/Conflict'
