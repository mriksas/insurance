PostClaimRequest:
  type: object
  description: |
    Claim details JSON part. In the OpenAPI UI, paste JSON like:
    {"enrollmentId":"43a2fb61-ea60-4096-960a-cc1d4a372d62","serviceDate":"2030-01-15","amount":125.50}
  example:
    enrollmentId: "43a2fb61-ea60-4096-960a-cc1d4a372d62"
    serviceDate: "2030-01-15"
    amount: 125.50
  required:
    - enrollmentId
    - serviceDate
    - amount
  properties:
    enrollmentId:
      type: string
      format: uuid
      description: Enrollment ID related to the claim.
      example: "43a2fb61-ea60-4096-960a-cc1d4a372d62"

    serviceDate:
      type: string
      format: date
      description: Date when the reimbursable service was provided.
      example: "2030-01-15"

    amount:
      type: number
      minimum: 0
      exclusiveMinimum: true
      multipleOf: 0.01
      description: Positive claim amount in EUR.
      example: 125.50

ClaimStatus:
  type: string
  description: Current status of a claim.
  enum:
    - PENDING
    - APPROVED
    - REJECTED
  example: PENDING

ClaimResponse:
  allOf:
    - $ref: '../common/schemas.yaml#/BaseListItemResponse'
    - type: object
      required:
        - claimNumber
        - serviceDate
        - planName
        - amount
        - status
        - consumerId
        - consumerFullName
        - planId
        - lastUpdateDate
      properties:
        claimNumber:
          type: string
          description: Unique claim number generated from the service date and daily sequence.
          pattern: '^LT[0-9]{11}$'
          example: LT20260715001
        serviceDate:
          type: string
          format: date
          description: Date the service was provided.
          example: "2026-07-15"
        planName:
          type: string
          description: Name of the insurance plan the claim is filed against.
          example: Standard Health
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Claimed amount in euros.
          example: 285.50
        status:
          $ref: '#/ClaimStatus'
        consumerId:
          type: string
          format: uuid
          description: ID of the consumer (employee) who submitted the claim.
          example: "7f9c8d13-5b1d-4a9d-9a47-0f3d8b6c9e12"
        consumerFullName:
          type: string
          description: Full name of the consumer (employee) who submitted the claim.
          example: John Doe
        planId:
          type: string
          format: uuid
          description: ID of the insurance plan the claim is filed against.
          example: "5a0d5de4-2f79-46f9-85c1-b588ea7b5c41"
        lastUpdateDate:
          type: string
          format: date
          description: Date the claim was last updated.
          example: "2026-07-20"

GetClaimsResponse:
  type: object
  required:
    - content
    - page
  properties:
    content:
      type: array
      items:
        $ref: './schemas.yaml#/ClaimResponse'
    page:
      $ref: '../common/schemas.yaml#/PageResponse'

UpdateClaimRequest:
  type: object
  required:
    - serviceDate
    - planId
    - amount
  properties:
    serviceDate:
      type: string
      format: date
      description: Date when the reimbursable service was provided.
    planId:
      type: string
      format: uuid
      description: Insurance plan associated with the claim's consumer enrollment.
    amount:
      type: number
      minimum: 0
      exclusiveMinimum: true
      multipleOf: 0.01
      description: Positive claim amount in EUR.
